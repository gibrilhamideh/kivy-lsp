[project]
name = "kivy-lsp"
version = "0.1.1"
description = "Language server for the Kivy language"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gibril Hamideh" },
]
keywords = [
    "kivy",
    "kv",
    "language-server",
    "lsp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]
dependencies = [
    "lsprotocol>=2025.0.0",
    "pygls>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/gibrilhamideh/kivy-lsp"
Repository = "https://github.com/gibrilhamideh/kivy-lsp"
Issues = "https://github.com/gibrilhamideh/kivy-lsp/issues"

[project.scripts]
kivy-lsp = "kivy_lsp.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pyright",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kivy_lsp"]

[tool.pyright]
include = [
    "src",
    "tests",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "SIM",
    "UP",
]
